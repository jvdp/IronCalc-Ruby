name: build
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - run: bundle exec standardrb

  # The Rubies ruby-lang.org currently maintains, plus `head`.
  ruby-versions:
    uses: ruby/actions/.github/workflows/ruby_versions.yml@master
    with:
      engine: cruby

  build:
    needs: ruby-versions
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJson(needs.ruby-versions.outputs.versions) }}
    # The development Ruby is an early warning, not a gate.
    continue-on-error: ${{ matrix.ruby == 'head' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tmp
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      # rb-sys has no Rust implementation of its stable API for an unreleased
      # Ruby; this compiles the C fallback instead. Set only for head: rb-sys
      # treats the variable as on whatever its value.
      - if: matrix.ruby == 'head'
        run: echo "RB_SYS_STABLE_API_COMPILED_FALLBACK=1" >> "$GITHUB_ENV"
      - run: bundle exec rake compile
      - run: bundle exec rake test
